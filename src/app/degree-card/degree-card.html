<app-experience-card
  icon="school"
  [highlighted]="false"
  [title]="degree.title"
  [subtitle]="degree.institution"
  [startDate]="degree.start"
  [endDate]="degree.end"
  completionTitle="CERTIFIED"
>
  <div class="grid grid-cols-2 gap-4">
    <div class="text-box">
      <div class="flex-col">
        <aside class="mb-2" style="color: gray">CORE_CURRICULUM</aside>
        <aside style="color: white">{{ degree.topics.join(' // ') }}</aside>
      </div>
    </div>
    <div class="text-box">
      <div class="flex-col">
        <aside class="mb-2" style="color: gray">THESIS_TOPIC</aside>
        <aside>"{{ degree.thesis }}"</aside>
      </div>
    </div>
  </div>
</app-experience-card>
