<section class="card">
  <p class="skill-category-title">{{ skillCategory.title }}</p>
  <section class="skill-grid">
    @for (skill of skillCategory.skills; track $index) {
      <div class="skill-row">
        <aside class="skill-title">{{ skill.name }}</aside>
        <aside class="skill-level">[{{ skill.level }}]</aside>
      </div>
      <!-- <a class="skill" href="{{ skill.url }}" target="_blank">{{ skill.name }}</a> -->
    }
  </section>
</section>
