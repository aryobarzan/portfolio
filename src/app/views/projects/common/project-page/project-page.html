<section class="container pt-8" id="project">
  <header class="mb-4 text-left">
    <app-project-header
      [id]="project().id"
      [title]="project().title"
      [description]="project().description"
    ></app-project-header>
  </header>
  <!-- On smaller devices, stack vertically in a column layout. 
   On larger (lg:) devices, make it a row instead. -->
  <div class="flex flex-col lg:flex-row gap-4 mt-8 justify-between">
    <app-project-technologies
      [technologies]="project().technologies || []"
    ></app-project-technologies>
    <!-- ml-auto ensures they are both pushed to the right when in a single row. -->
    <div class="flex flex-col lg:flex-row gap-4 lg:ml-auto">
      <app-project-specifications
        [specifications]="project().specifications"
        [icon]="project().iconURL"
      ></app-project-specifications>
      <app-project-links [links]="project().links || []"></app-project-links>
    </div>
  </div>
  <br />
  <br />
</section>
