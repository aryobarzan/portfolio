<article
  class="experience-card h-full flex flex-col p-4 text-left"
  role="article"
  aria-label="{{ title() }} at {{ subtitle() }}"
>
  <div class="flex gap-4 items-start">
    <div class="flex-1 flex flex-col">
      <header class="flex items-start justify-between gap-4">
        <div class="flex gap-4 items-center">
          <div class="icon-box">
            <span
              class="material-symbols-outlined"
              [style]="highlighted() ? 'color: var(--traxus-primary)' : 'color: white'"
              >{{ icon() }}</span
            >
          </div>
          <div>
            <div class="experience-title">{{ title() }}</div>
            <div class="experience-location">{{ subtitle() }}</div>
          </div>
        </div>

        <div class="experience-date whitespace-nowrap text-left flex-col items-end place-items-end">
          <!-- usage of Angular's DatePipe (reusable function) to format the dates in human-readable fashion -->
          <!-- Example: 'Mar 2025' -->
          @if (isRecent()) {
            <div class="colored-yellow-box mb-2">RECENT</div>
          } @else if (isCompleted()) {
            <div class="colored-gray-box mb-2">{{ completionTitle() }}</div>
          }
          <div>
            <time [attr.datetime]="startDate()">{{ startDate() | date: 'yyyy.MM' }}</time>

            @if (endDate()) {
              —
              <time [attr.datetime]="endDate()">{{ endDate() | date: 'yyyy.MM' }}</time>
            } @else {
              — PRESENT
            }
          </div>
        </div>
      </header>
      <hr class="mt-6 mb-6" style="color: gray; opacity: 0.5" />
      <!-- insertion point for content projected by the parent component -->
      <ng-content />
    </div>
  </div>
</article>
